[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-benchmark-bot"
version = "0.3.0"
description = "Experimental, safety-gated desktop automation routines for selected Human Benchmark mini-games."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "64r3al" }
]
dependencies = [
  "PyAutoGUI>=0.9.54",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "pyperclip>=1.8.2",
]

[project.optional-dependencies]
ui = [
  "PySide6-Essentials>=6.7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "PySide6-Essentials>=6.7",
]

[project.scripts]
human-benchmark-bot = "human_benchmark_bot.cli:main"
human-benchmark-bot-ui = "human_benchmark_bot.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["human_benchmark_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
